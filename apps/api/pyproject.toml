[project]
name = "mathgen-api"
version = "0.1.0"
description = "Backend MathGen AI (FastAPI · PostgreSQL · Redis/Celery · SymPy)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "email-validator>=2.2",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "python-ulid>=2.7",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "sympy>=1.13",
  "pypdf>=5",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]
# Mô hình phân loại đề (tùy chọn). torch bản CPU: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
ml = ["torch>=2.4", "transformers>=4.44"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
